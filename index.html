<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Мобильный навигатор с OSRM Trip и трекером</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;-webkit-tap-highlight-color:transparent;}
#map{height:100vh;width:100vw;}

.leaflet-control-attribution { display: none !important; }

#file-input{position:absolute;z-index:1200;left:50%;transform:translateX(-50%);top:10px;background:#fff;padding:6px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.15);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:96%;}
#file-input input[type=file]{font-size:13px;}
#file-input button{font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid #ccc;background:#f7f7f7;cursor:pointer;}
#file-input button:active{background:#eee;}
#file-input button.active{background:#0077cc;color:#fff;border-color:#0077cc;}

#rec-indicator {
  display:none;
  align-items:center;
  gap:5px;
  font-size:12px;
  font-weight:600;
  color:#d90429;
  padding:0 4px;
}
#rec-dot {
  width:9px;
  height:9px;
  background:#d90429;
  border-radius:50%;
}
.blink { animation: blink 1s infinite; }
@keyframes blink { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }

.nav-arrow-casing {
  stroke: #ffffff !important;
  stroke-width: 9 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
  opacity: 0.95;
}
.nav-arrow-main {
  stroke: #0077ff !important;
  stroke-width: 6 !important;
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
  opacity: 1;
}

.nav-heading-arrow {
  width: 22px;
  height: 22px;
  transform-origin: center center;
  filter: drop-shadow(0 0 2px #ffffff);
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-heading-arrow svg {
  width: 100%;
  height: 100%;
  fill: #0077ff;
}

#info-box{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:1000;
  background:rgba(255,255,255,0.95);
  padding:6px 12px;
  border-radius:8px;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
  min-width:160px;
  text-align:center;
  font-size:13px;
  pointer-events:none;
}

#version-label{
  position:absolute;
  bottom:5px;
  left:10px;
  color:#000;
  font-size:11px;
  z-index:1200;
  text-shadow:0 0 3px rgba(255,255,255,0.8);
}

.leaflet-left .leaflet-control-zoom {
  margin-bottom: 55px !important;
  margin-left: 10px !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
  border: none !important;
}

.controls-right-stack {
  position: absolute;
  bottom: 20px;
  right: 10px;
  z-index: 1200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.controls-right-stack .leaflet-control-layers {
  margin: 0 !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
  border: none !important;
  border-radius: 8px !important;
}

#centerUserBtn{
  background:#fff;
  border:none;
  border-radius:50%;
  width:44px;
  height:44px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  display:flex;
  justify-content:center;
  align-items:center;
  transition:transform 0.15s ease;
  padding: 0;
}
#centerUserBtn:active{transform:scale(0.95);}
#centerUserBtn svg{width:24px;height:24px;stroke:#0077cc;stroke-width:2;fill:none;}

textarea{resize:none;font-size:13px;}

.marker-label{
  font-size:12px;
  font-weight:bold;
  color:#000;
  text-align:center;
  transform:translate(-50%,-22px);
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="file-input">
  <input type="file" id="csvFile" accept=".csv" />
  <button id="locBtn">GPS</button>
  <button id="refreshBtn">Обновить</button>
  <button id="clearBtn">Очистить</button>
  
  <button id="navStartBtn">Старт Нав</button>
  <button id="navStopBtn">Стоп Нав</button>
  <button id="trackStartBtn" title="Начать запись пути">● Запись трека</button>
  <button id="trackStopBtn" title="Остановить запись">■ Стоп трек</button>
  <button id="downloadBtn">Сохранить CSV</button>
  <button id="trackSaveBtn" title="Скачать записанный трек">💾 Трек</button>
  
  <div id="rec-indicator"><div id="rec-dot" class="blink"></div>REC</div>
</div>

<div id="info-box">
  <b>Маршрут</b><br>
  <span id="info-distance">Длина: —</span><br>
  <span id="info-duration">Время: —</span>
  <div id="track-info-container" style="border-top:1px solid #ddd; margin-top:4px; padding-top:4px;">
    <b>Записано</b><br>
    <span>Дистанция: <span id="track-dist">0.00</span> км</span><br>
    <span>Время: <span id="track-time">0:00</span></span>
  </div>
</div>

<div id="map"></div>

<div class="controls-right-stack" id="rightStack">
  <button id="centerUserBtn" title="Центрировать">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="2" x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="6" y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  </button>
</div>

<div id="version-label">версия 3.9 (проекция на дорогу)</div>

<script>
const map = L.map('map', {zoomControl:false}).setView([51.16,71.47],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

L.control.zoom({position:'bottomleft'}).addTo(map);

let csvMarkersLayer = L.layerGroup().addTo(map);
let routeLayer = L.layerGroup().addTo(map);
let remainingRouteLayer = L.layerGroup().addTo(map);
let recordedTrackLayer = L.layerGroup().addTo(map);
let polygonLayer = L.layerGroup().addTo(map);

let pointsPartLayer = L.layerGroup();
let pointsPart2Layer = L.layerGroup();
let pointsPart3Layer = L.layerGroup();

const overlays = {
  "Точки CSV": csvMarkersLayer,
  "Основной маршрут": routeLayer,
  "Навигация": remainingRouteLayer,
  "Записанный трек": recordedTrackLayer,
  "H3 Гексагоны (корень)": polygonLayer,
  "Точки (1_part)": pointsPartLayer,
  "Точки (2_part)": pointsPart2Layer,
  "Точки (3_part)": pointsPart3Layer
};
const layerControl = L.control.layers(null, overlays, {collapsed: true});
layerControl.addTo(map);

const stackEl = document.getElementById('rightStack');
stackEl.insertBefore(layerControl.getContainer(), document.getElementById('centerUserBtn'));

function renderGeoJson(geoData) {
  polygonLayer.clearLayers();
  const poly = L.geoJSON(geoData, {
    style: {
      color: '#000000',
      weight: 1.5,
      opacity: 0.85,
      fillColor: '#000000',
      fillOpacity: 0.08
    },
    onEachFeature: function(feature, layer) {
      if (feature.properties) {
        let popupText = `<b>h3_id:</b> ${feature.properties.h3_id || feature.properties.hex || ''}<br>`;
        popupText += `<b>orders:</b> ${feature.properties.total_orders || 0}`;
        layer.bindPopup(popupText);
      }
    }
  }).addTo(polygonLayer);
  
  if (poly.getLayers().length > 0) {
    map.fitBounds(poly.getBounds());
  }
}

fetch('hex.geojson')
  .then(res => {
    if(!res.ok) throw new Error('Файл hex.geojson не найден в корне');
    return res.json();
  })
  .then(data => renderGeoJson(data))
  .catch(err => console.warn('Автозагрузка hex.geojson недоступна:', err));

function renderColoredPoints(geoData, layer, color, fillColor) {
  layer.clearLayers();
  L.geoJSON(geoData, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 5,
        color: color,
        fillColor: fillColor,
        fillOpacity: 0.85,
        weight: 1.5
      });
    },
    onEachFeature: function(feature, layerTarget) {
      if (feature.properties) {
        let props = feature.properties;
        let popupText = `<b>from_address:</b> ${props.from_address || '—'}<br>`;
        popupText += `<b>cnt:</b> ${props.cnt || 0}`;
        layerTarget.bindPopup(popupText);
      }
    }
  }).addTo(layer);
}

fetch('1_part.geojson').then(r=>r.ok?r.json():null).then(d=>{if(d) renderColoredPoints(d, pointsPartLayer, '#1e7e34', '#28a745');}).catch(()=>{});
fetch('2_part.geojson').then(r=>r.ok?r.json():null).then(d=>{if(d) renderColoredPoints(d, pointsPart2Layer, '#c7511f', '#fd7e14');}).catch(()=>{});
fetch('3_part.geojson').then(r=>r.ok?r.json():null).then(d=>{if(d) renderColoredPoints(d, pointsPart3Layer, '#0077cc', '#17a2b8');}).catch(()=>{});

let userMarker = null;
let autoFollow = true;
let csvData = [];
let csvFileName = '';
let userCoords = null;
let activeRouteCoords = [];
let osrmCoords = [];
let  = null;

let navRouteCoords = [];
let navWatchId = null;

let isTracking = false;
let recordedTrack = [];
let trackDistance = 0;
let lastTrackPos = null;
let trackStartTime = null;
let trackTimerInterval = null;
let lastFix = null;
let trackRecordInterval = null;
let trackPolyline = null;

const infoDistanceEl = document.getElementById('info-distance');
const infoDurationEl = document.getElementById('info-duration');
const trackDistEl = document.getElementById('track-dist');
const trackTimeEl = document.getElementById('track-time');
const recIndicatorEl = document.getElementById('rec-indicator');

map.on('movestart zoomstart',()=>{ autoFollow = false; });

function centerOnUser(zoom=15){ if(userCoords) map.flyTo(userCoords,zoom,{duration:1.0}); }

function haversineDist(a, b){
  const R = 6371000;
  const dLat = (b[0]-a[0]) * Math.PI / 180;
  const dLon = (b[1]-a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function getPixelBearing(p1, p2) {
  const pt1 = map.latLngToLayerPoint(L.latLng(p1));
  const pt2 = map.latLngToLayerPoint(L.latLng(p2));
  const dx = pt2.x - pt1.x;
  const dy = pt2.y - pt1.y;
  return (Math.atan2(dy, dx) * 180 / Math.PI) + 90;
}

// Проекция точки P на отрезок [A, B]
function projectPointOnSegment(p, a, b) {
  const pLat = p[0], pLng = p[1];
  const aLat = a[0], aLng = a[1];
  const bLat = b[0], bLng = b[1];

  const cosLat = Math.cos(pLat * Math.PI / 180);
  const px = pLng * cosLat, py = pLat;
  const ax = aLng * cosLat, ay = aLat;
  const bx = bLng * cosLat, by = bLat;

  const dx = bx - ax;
  const dy = by - ay;
  const lenSq = dx * dx + dy * dy;

  if (lenSq === 0) return { point: a, t: 0 };

  let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));

  return {
    point: [aLat + (bLat - aLat) * t, aLng + (bLng - aLng) * t],
    t: t
  };
}

// Поиск ближайшей проекции на всем протяжении полилинии
function findNearestRoadProjection(userPt, polyCoords) {
  let minDistance = Infinity;
  let bestProj = null;
  let segIndex = 0;

  for (let i = 0; i < polyCoords.length - 1; i++) {
    const proj = projectPointOnSegment(userPt, polyCoords[i], polyCoords[i + 1]);
    const dist = haversineDist(userPt, proj.point);

    if (dist < minDistance) {
      minDistance = dist;
      bestProj = proj.point;
      segIndex = i;
    }
  }

  return {
    point: bestProj || polyCoords[0],
    segIndex: segIndex,
    distance: minDistance
  };
}

function checkPointsInUserRadius(){
  if(!userCoords) return;

  csvData.forEach((p)=>{
    if(p.status === "0"){
      const d = L.latLng(userCoords).distanceTo([p.lat, p.lon]);
      if(d <= 50){
        p.status = "1";
        if(p.marker){
          p.marker.setStyle({ color: 'green', fillColor: 'green' });
        }
      }
    }
  });
}

function updateUserPosition(pos){ 
  userCoords = [pos.coords.latitude, pos.coords.longitude]; 
  lastFix = {
    lat: userCoords[0],
    lon: userCoords[1],
    speed: pos.coords.speed || 0,
    time: Date.now()
  };

  if(!userMarker){ 
    userMarker = L.circleMarker(userCoords,{radius:6,color:'#0077cc',fillColor:'#0077cc',fillOpacity:0.8}).addTo(map).bindPopup('Вы здесь'); 
  } else {
    userMarker.setLatLng(userCoords);
  }

  if(!userRadius) {
    userRadius = L.circle(userCoords,{radius:50,color:'black',weight:1,fillOpacity:0}).addTo(map);
  } else {
    userRadius.setLatLng(userCoords);
  }

  checkPointsInUserRadius();
  if(autoFollow) centerOnUser(); 
}

function requestUserLocation(){ 
  if(!navigator.geolocation){ alert('Геолокация не поддерживается'); return; } 
  navigator.geolocation.getCurrentPosition(updateUserPosition, err=>alert('GPS недоступен'), {enableHighAccuracy:true}); 
}

// ================= ТРЕКЕР =================
function recordTrackPoint(){
  if(!isTracking || !lastFix) return;
  const {lat, lon, speed, time} = lastFix;

  if(speed < 0.5 && lastTrackPos) return;

  if(lastTrackPos){
    const d = haversineDist(lastTrackPos, [lat, lon]);
    if(d < 5) return;
    trackDistance += d;
  }

  lastTrackPos = [lat, lon];
  recordedTrack.push({lat, lon, time, speed, dist: trackDistance});

  if(!trackPolyline){
    trackPolyline = L.polyline([[lat, lon]], {color: '#d90429', weight: 4, opacity: 0.85}).addTo(recordedTrackLayer);
  } else {
    trackPolyline.addLatLng([lat, lon]);
  }

  L.circleMarker([lat, lon], {radius: 2, color: '#d90429', fillColor: '#d90429'}).addTo(recordedTrackLayer);
  trackDistEl.textContent = (trackDistance / 1000).toFixed(2);
}

function startTrackTimer(){
  trackStartTime = Date.now();
  trackTimerInterval = setInterval(()=>{
    const sec = Math.floor((Date.now() - trackStartTime)/1000);
    trackTimeEl.textContent = Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
  }, 1000);
}

function stopTrackTimer(){
  clearInterval(trackTimerInterval);
}

document.getElementById('trackStartBtn').addEventListener('click', ()=>{
  if(isTracking) return;
  isTracking = true;
  document.getElementById('trackStartBtn').classList.add('active');
  recIndicatorEl.style.display = 'inline-flex';
  
  if(!navWatchId){
    requestUserLocation();
  }
  startTrackTimer();
  trackRecordInterval = setInterval(recordTrackPoint, 3000);
});

document.getElementById('trackStopBtn').addEventListener('click', ()=>{
  if(!isTracking) return;
  isTracking = false;
  document.getElementById('trackStartBtn').classList.remove('active');
  recIndicatorEl.style.display = 'none';
  
  clearInterval(trackRecordInterval);
  stopTrackTimer();
});

document.getElementById('trackSaveBtn').addEventListener('click', ()=>{
  if(!recordedTrack.length){ alert('Трек пуст'); return; }
  let csv = 'lat,lon,time,speed_mps,distance_m\n';
  recordedTrack.forEach(p=>{
    csv += `${p.lat},${p.lon},${p.time},${p.speed.toFixed(2)},${p.dist.toFixed(2)}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const now = new Date().toISOString().slice(0,10);
  a.download = `track_${now}.csv`;
  a.click();
});

// ================= OSRM МАРШРУТ =================
function buildOptimizedRoute(){
  routeLayer.clearLayers();
  activeRouteCoords = csvData.filter(p => String(p.status) === "0").map(p => [Number(p.lat), Number(p.lon)]);
  osrmCoords = [...activeRouteCoords];

  if(osrmCoords.length === 0){
    infoDistanceEl.textContent='Длина: —';
    infoDurationEl.textContent='Время: —';
    navRouteCoords = [];
    if(remainingRouteLayer){ remainingRouteLayer.clearLayers(); }
    return;
  }

  const tripCoords = userCoords ? [userCoords, ...osrmCoords] : osrmCoords;
  const coordStr = tripCoords.map(c => `${c[1]},${c[0]}`).join(';');

  fetch(`https://router.project-osrm.org/trip/v1/driving/${coordStr}?source=first&roundtrip=false&overview=full&geometries=geojson`)
    .then(r=>r.json())
    .then(json=>{
      if(!json.trips || !json.trips.length){ alert('OSRM не смог построить маршрут'); return; }
      const trip = json.trips[0];
      routeLayer.clearLayers();

      L.geoJSON(trip.geometry,{style:{color:'#0077cc',weight:3,opacity:0.9}}).addTo(routeLayer);
      navRouteCoords = trip.geometry.coordinates.map(c => [c[1],c[0]]);

      if (userCoords && navRouteCoords.length > 0) {
        const airStartDist = L.latLng(userCoords).distanceTo(L.latLng(navRouteCoords[0]));
        if (airStartDist > 20) {
          L.polyline([[userCoords[0], userCoords[1]], navRouteCoords[0]], {
            color: '#0077cc',
            weight: 2.5,
            opacity: 0.8,
            dashArray: '5, 8'
          }).addTo(routeLayer);
        }
      }

      const distanceKm = (trip.distance/1000).toFixed(2);
      infoDistanceEl.textContent = `Длина: ${distanceKm} км`;
      const totalMinutes = Math.round(trip.duration/60);
      infoDurationEl.textContent = totalMinutes<60?`${totalMinutes} мин`:`${Math.floor(totalMinutes/60)} ч ${totalMinutes%60} мин`;
      if(userCoords) centerOnUser(15);
    })
    .catch(err=>{ alert('Ошибка OSRM'); console.error(err); });
}

// ================= ПОПАП КАРТОЧКИ =================
function createPopup(point, marker, index){
  const container=document.createElement('div');
  container.style.display='flex'; container.style.flexDirection='column'; container.style.gap='4px';
  container.style.fontSize='14px';

  const latDiv=document.createElement('div');
  latDiv.style.display='flex'; latDiv.style.gap='4px';
  const latInput=document.createElement('input');
  latInput.type='text';
  latInput.value=`${point.lat}, ${point.lon}`;
  latInput.readOnly=true;
  latInput.style.border='none';
  latInput.style.background='transparent';
  latInput.style.flexGrow='1';
  latInput.style.fontSize='13px';
  const copyBtn=document.createElement('button');
  copyBtn.textContent='📋';
  copyBtn.title='Скопировать';
  copyBtn.style.fontSize='14px';
  copyBtn.addEventListener('click',()=>{ navigator.clipboard.writeText(latInput.value); copyBtn.textContent='✔'; setTimeout(()=>copyBtn.textContent='📋',1000); });
  latDiv.appendChild(latInput); latDiv.appendChild(copyBtn); container.appendChild(latDiv);

  if(point.hex){
    const hexDiv=document.createElement('div');
    hexDiv.style.display='flex'; hexDiv.style.gap='4px';
    const hexInput=document.createElement('input');
    hexInput.type='text';
    hexInput.value=`hex: ${point.hex}`;
    hexInput.readOnly=true;
    hexInput.style.border='none';
    hexInput.style.background='transparent';
    hexInput.style.flexGrow='1';
    hexInput.style.fontSize='13px';
    const hexCopyBtn=document.createElement('button');
    hexCopyBtn.textContent='📋';
    hexCopyBtn.title='Скопировать hex';
    hexCopyBtn.style.fontSize='14px';
    hexCopyBtn.addEventListener('click',()=>{ navigator.clipboard.writeText(point.hex); hexCopyBtn.textContent='✔'; setTimeout(()=>hexCopyBtn.textContent='📋',1000); });
    hexDiv.appendChild(hexInput); hexDiv.appendChild(hexCopyBtn); container.appendChild(hexDiv);
  }

  const statusDiv = document.createElement('div');
  statusDiv.style.display = 'flex';
  statusDiv.style.flexDirection = 'column';
  statusDiv.style.gap = '4px';
  const statusLabel = document.createElement('span'); statusLabel.textContent = 'status:';
  const btnContainer = document.createElement('div'); btnContainer.style.display='flex'; btnContainer.style.gap='4px';
  const btn0 = document.createElement('button'); btn0.textContent='В процессе';
  const btn1 = document.createElement('button'); btn1.textContent='Выполнено';
  [btn0, btn1].forEach(b => { b.style.fontSize='14px'; b.style.flex='1'; });
  
  let originalValue = String(point.status);
  function updateButtons() { 
    if(originalValue==='0'){ btn0.style.background='#0077cc'; btn0.style.color='#fff'; btn1.style.background=''; btn1.style.color=''; }
    else { btn1.style.background='#0077cc'; btn1.style.color='#fff'; btn0.style.background=''; btn0.style.color=''; }
  }
  updateButtons();

  const saveBtn = document.createElement('button'); saveBtn.textContent='💾'; saveBtn.style.display='none'; saveBtn.style.fontSize='14px';
  const cancelBtn = document.createElement('button'); cancelBtn.textContent='❌'; cancelBtn.style.display='none'; cancelBtn.style.fontSize='14px';
  
  btn0.addEventListener('click',()=>{ originalValue='0'; updateButtons(); saveBtn.style.display='inline-block'; cancelBtn.style.display='inline-block'; });
  btn1.addEventListener('click',()=>{ originalValue='1'; updateButtons(); saveBtn.style.display='inline-block'; cancelBtn.style.display='inline-block'; });
  
  saveBtn.addEventListener('click',()=>{
    point.status = originalValue;
    csvData[index].status = originalValue;
    marker.setStyle({color: originalValue==='0'?'red':'green', fillColor: originalValue==='0'?'red':'green'});
    saveBtn.style.display='none'; cancelBtn.style.display='none';
    buildOptimizedRoute();
  });
  
  cancelBtn.addEventListener('click',()=>{ originalValue = point.status; updateButtons(); saveBtn.style.display='none'; cancelBtn.style.display='none'; });
  
  btnContainer.appendChild(btn0); btnContainer.appendChild(btn1);
  statusDiv.appendChild(statusLabel); statusDiv.appendChild(btnContainer); statusDiv.appendChild(saveBtn); statusDiv.appendChild(cancelBtn);
  container.appendChild(statusDiv);

  const commentDiv=document.createElement('div');
  commentDiv.style.display='flex'; commentDiv.style.flexDirection='column'; commentDiv.style.gap='4px';
  const commentLabel=document.createElement('span'); commentLabel.textContent='comment:';
  const commentInput=document.createElement('textarea'); commentInput.value=point.comment||""; commentInput.rows=2; commentInput.style.width='100%'; commentInput.style.fontSize='13px';
  const commentSave=document.createElement('button'); commentSave.textContent='💾'; commentSave.style.display='none'; commentSave.style.fontSize='14px';
  const commentCancel=document.createElement('button'); commentCancel.textContent='❌'; commentCancel.style.display='none'; commentCancel.style.fontSize='14px';
  let originalComment = point.comment || "";
  commentInput.addEventListener('input',()=>{
    if(commentInput.value !== originalComment){ commentSave.style.display='inline-block'; commentCancel.style.display='inline-block'; } 
    else{ commentSave.style.display='none'; commentCancel.style.display='none'; }
  });
  commentSave.addEventListener('click',()=>{
    point.comment = commentInput.value; csvData[index].comment = commentInput.value; originalComment = commentInput.value;
    commentSave.style.display='none'; commentCancel.style.display='none';
  });
  commentCancel.addEventListener('click',()=>{ commentInput.value = originalComment; commentSave.style.display='none'; commentCancel.style.display='none'; });
  commentDiv.appendChild(commentLabel); commentDiv.appendChild(commentInput); commentDiv.appendChild(commentSave); commentDiv.appendChild(commentCancel);
  container.appendChild(commentDiv);

  const gtDiv = document.createElement('div');
  gtDiv.style.display='flex'; gtDiv.style.flexDirection='column'; gtDiv.style.gap='4px';
  const gtLabel = document.createElement('span'); gtLabel.textContent='gt_name:';
  const gtInput = document.createElement('input');
  gtInput.type='text'; gtInput.value = point.gt_name || ""; gtInput.readOnly = true;
  gtInput.style.border='none'; gtInput.style.background='transparent'; gtInput.style.fontSize='13px';
  gtDiv.appendChild(gtLabel); gtDiv.appendChild(gtInput); container.appendChild(gtDiv);

  return container;
}

// ================= СОБЫТИЯ =================
document.getElementById('csvFile').addEventListener('change', function(ev){
  const file=ev.target.files[0]; if(!file) return; csvFileName=file.name;
  Papa.parse(file,{header:true,dynamicTyping:false,skipEmptyLines:true,complete:function(results){
    const data=results.data||[]; 
    csvData=[]; 
    csvMarkersLayer.clearLayers(); 
    routeLayer.clearLayers();
    activeRouteCoords=[]; 
    osrmCoords=[];
    data.forEach((r,i)=>{
      const lat = Number(r.lat!==undefined ? r.lat : r.latitude);
      const lon = Number(r.lon!==undefined ? r.lon : r.longitude);
      const hex = r.hex || r.h3x10_id || r.h3 || "";
      const status = (String(r.status) === "1") ? "1" : "0";
      const comment=r.comment||"";
      const count=r.count||"";
      const gt_name=r.gt_name||"";
      csvData.push({lat,lon,hex,status,comment,count,gt_name});
      const color=status==="0"?'red':'green';
      const marker=L.circleMarker([lat,lon],{radius:6,color:color,fillColor:color,fillOpacity:0.8}).addTo(csvMarkersLayer);
      csvData[i].marker = marker;
      
      if(count !== ""){
        L.marker([lat,lon],{
          icon: L.divIcon({
            className:'marker-label',
            html: count,
            iconSize:[30,12],
            iconAnchor:[15,30]
          }),
          interactive:false
        }).addTo(csvMarkersLayer);
      }
      marker.bindPopup(() => createPopup(csvData[i], marker, i), {minWidth: 160});
    });
    buildOptimizedRoute();
  }});
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  if(!csvData.length){ alert('Нет данных'); return; }
  const cleanData = csvData.map(point => {
    const { marker, ...rest } = point;
    return rest;
  });
  const csv=Papa.unparse(cleanData);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); 
  const link=document.createElement('a'); 
  link.href=url; 
  link.download=csvFileName||'updated.csv';
  document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
});

document.getElementById('locBtn').addEventListener('click',()=>{ autoFollow=true; requestUserLocation(); });
document.getElementById('refreshBtn').addEventListener('click',()=>{ buildOptimizedRoute(); });
document.getElementById('clearBtn').addEventListener('click',()=>{ 
  csvMarkersLayer.clearLayers(); 
  routeLayer.clearLayers(); 
  polygonLayer.clearLayers();
  pointsPartLayer.clearLayers();
  pointsPart2Layer.clearLayers();
  pointsPart3Layer.clearLayers();
  recordedTrackLayer.clearLayers();
  if(remainingRouteLayer){ remainingRouteLayer.clearLayers(); }
  document.getElementById('csvFile').value=''; 
  csvData=[]; activeRouteCoords=[]; osrmCoords=[]; navRouteCoords=[]; 
  recordedTrack=[]; trackDistance=0; lastTrackPos=null; trackPolyline=null;
  infoDistanceEl.textContent='Длина: —'; 
  infoDurationEl.textContent='Время: —';
  trackDistEl.textContent='0.00';
  trackTimeEl.textContent='0:00';
  
  document.getElementById('navStartBtn').classList.remove('active');
  document.getElementById('trackStartBtn').classList.remove('active');
  recIndicatorEl.style.display = 'none';
  if(isTracking){ isTracking = false; clearInterval(trackRecordInterval); stopTrackTimer(); }
  stopRealNavigation();
});
document.getElementById('centerUserBtn').addEventListener('click',()=>{ if(userCoords){ autoFollow=true; centerOnUser(17); } });

// ================= НАВИГАЦИЯ =================
function startRealNavigation(){
  if(!navRouteCoords.length){ alert('Нет маршрута для навигации'); return; }
  if(!navigator.geolocation){ alert('Геолокация не поддерживается'); return; }
  
  document.getElementById('navStartBtn').classList.add('active');

  if(navWatchId) navigator.geolocation.clearWatch(navWatchId);
  navWatchId = navigator.geolocation.watchPosition(pos=>{
    updateUserPosition(pos);

    if(navRouteCoords.length > 1 && userCoords){
      remainingRouteLayer.clearLayers();

      // Точная проекция геопозиции на ближайший сегмент дороги
      const proj = findNearestRoadProjection(userCoords, navRouteCoords);
      const roadPoint = proj.point;
      const segIndex = proj.segIndex;
      const distToRoad = proj.distance;

      // Порог дороги: 25 метров (учитывает ширину улицы, тротуар и дрейф GPS)
      const isOffRoad = distToRoad > 25;

      // 1. Воздушный пунктир только при реальном удалении от дороги
      if (isOffRoad) {
        L.polyline([[userCoords[0], userCoords[1]], roadPoint], {
          color: 'red',
          weight: 3,
          opacity: 0.85,
          dashArray: '6, 8'
        }).addTo(remainingRouteLayer);
      }

      // 2. Оставшийся путь вперёд по дорожной сети от точки проекции
      let remainingRoad = [roadPoint];
      for (let i = segIndex + 1; i < navRouteCoords.length; i++) {
        remainingRoad.push(navRouteCoords[i]);
      }

      L.polyline(remainingRoad, {
        color: 'red',
        weight: 3,
        opacity: 0.85
      }).addTo(remainingRouteLayer);

      // ================= СИНЯЯ СТРЕЛКА (ВПЕРЁД ПО МАРШРУТУ) =================
      let arrowCoords = [];
      let distAccum = 0;

      if (isOffRoad) {
        // Пунктирный выход на дорогу
        L.polyline([[userCoords[0], userCoords[1]], roadPoint], {
          className: 'nav-arrow-casing',
          dashArray: '8, 8',
          interactive: false
        }).addTo(remainingRouteLayer);

        L.polyline([[userCoords[0], userCoords[1]], roadPoint], {
          className: 'nav-arrow-main',
          dashArray: '8, 8',
          interactive: false
        }).addTo(remainingRouteLayer);

        arrowCoords.push(roadPoint);
        distAccum = distToRoad;
      } else {
        // Мы на улице: сплошное соединение
        arrowCoords.push([userCoords[0], userCoords[1]]);
        arrowCoords.push(roadPoint);
      }

      // Набор 200 метров строго вперед по линии движения
      for (let i = 0; i < remainingRoad.length - 1; i++) {
        const from = L.latLng(remainingRoad[i]);
        const to = L.latLng(remainingRoad[i + 1]);
        const segDist = from.distanceTo(to);

        if (distAccum + segDist > 200) {
          const remaining = 200 - distAccum;
          const ratio = remaining / segDist;
          const lat = from.lat + (to.lat - from.lat) * ratio;
          const lng = from.lng + (to.lng - from.lng) * ratio;
          arrowCoords.push([lat, lng]);
          break;
        } else {
          arrowCoords.push([to.lat, to.lng]);
          distAccum += segDist;
        }
      }

      // Отрисовка сплошной навигационной стрелы
      if (arrowCoords.length >= 2) {
        L.polyline(arrowCoords, { className: 'nav-arrow-casing', interactive: false }).addTo(remainingRouteLayer);
        L.polyline(arrowCoords, { className: 'nav-arrow-main', interactive: false }).addTo(remainingRouteLayer);

        // Наконечник по направлению движения
        const lastPts = [arrowCoords[arrowCoords.length - 2], arrowCoords[arrowCoords.length - 1]];
        const headAngle = getPixelBearing(lastPts[0], lastPts[1]);

        const arrowHeadIcon = L.divIcon({
          className: '',
          html: `<div class="nav-heading-arrow" style="transform: rotate(${headAngle}deg);"><svg viewBox="0 0 24 24"><polygon points="12,2 22,22 12,17 2,22"/></svg></div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });

        L.marker(lastPts[1], { icon: arrowHeadIcon, interactive: false }).addTo(remainingRouteLayer);
      }
    }

  }, err=>alert('Ошибка GPS'), {enableHighAccuracy:true, maximumAge:0, timeout:5000});
}

function stopRealNavigation(){ 
  document.getElementById('navStartBtn').classList.remove('active');
  if(navWatchId){ navigator.geolocation.clearWatch(navWatchId); navWatchId=null; } 
  if(remainingRouteLayer){ remainingRouteLayer.clearLayers(); } 
}

document.getElementById('navStartBtn').addEventListener('click', startRealNavigation);
document.getElementById('navStopBtn').addEventListener('click', stopRealNavigation);

</script>
